<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Misery Discord bot command directory." />
    <title>Misery Commands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260812c" />
  </head>
  <body>
    <main class="directory-shell">
      <header class="site-header">
        <a class="brand" href="#" aria-label="Misery home">
          <img src="icon.png?v=20260812b" alt="Misery bot icon" />
          <span>Misery</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a class="active" href="#commands">Commands</a>
          <a href="#commands">Discover</a>
          <a href="#commands">Status</a>
          <a href="#commands">Docs</a>
          <a href="#commands">Embeds</a>
        </nav>
        <span class="site-status"><i></i> online</span>
      </header>

      <section class="directory-layout" id="commands">
        <aside class="category-card">
          <p class="overline">Misery bot</p>
          <h1>Command<br />directory</h1>
          <p class="category-copy">Browse every public command by module.</p>
          <div class="rule"></div>
          <p class="category-label">Select category</p>
          <div id="module-grid" class="module-list" aria-label="Command categories"></div>
        </aside>

        <section class="commands-column" aria-labelledby="command-heading">
          <div class="commands-heading">
            <div>
              <p class="overline">Public commands</p>
              <h2 id="command-heading">All commands</h2>
            </div>
            <span id="result-count" class="result-count"></span>
          </div>
          <label class="search-wrap">
            <span aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="Search for commands" aria-label="Search for commands" />
          </label>
          <div id="command-list" class="command-list"></div>
        </section>
      </section>
    </main>
    <script src="app.js?v=20260812c"></script>
  </body>
</html>
