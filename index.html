<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Misery Commands</title>
    <meta name="description" content="Public command directory for Misery." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="nav-left">
          <div class="bot-avatar" aria-label="Misery bot icon">
            <span class="bot-mark">M</span>
          </div>
          <nav class="main-nav" aria-label="Main navigation">
            <a class="active" href="#">Commands</a>
            <a href="#">Discover</a>
            <a href="#">Status</a>
            <a href="#">Docs</a>
            <a href="#">Embeds</a>
          </nav>
        </div>

        <div class="nav-right">
          <div class="sponsor-pill">
            <span class="spark">✦</span>
            <span>Sponsored by HostingBot</span>
          </div>
          <button class="icon-btn" aria-label="Search">⌕</button>
          <button class="icon-btn user-btn" aria-label="Profile">◔</button>
        </div>
      </header>

      <main class="content">
        <section class="title-row">
          <div>
            <div class="title-wrap">
              <span class="title-code">&lt;/&gt;</span>
              <h1>Commands</h1>
            </div>
            <p class="title-sub">Public command directory for Misery. Fast search, clean modules, and complete syntax.</p>
          </div>
          <div class="header-actions">
            <input id="search" class="search-input" type="search" placeholder="Search commands, aliases, descriptions..." aria-label="Search commands" />
          </div>
        </section>

        <section class="module-strip" id="module-grid" aria-label="Command categories"></section>

        <section class="command-panel">
          <div id="command-list" class="command-list"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
